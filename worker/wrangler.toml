name = "feelgood-copy-dev"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = [ "nodejs_compat" ]

# Free tier covers 100,000 requests/day, which is far beyond anything this
# app does during Shipaton (PRD §11).

# Secrets — set per environment, never committed here:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put REVENUECAT_SECRET_API_KEY
# (the RevenueCat *secret* v1 REST key, distinct from the public SDK key in
# FeelGood/Support/RevenueCatConstants.swift)

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "b78d072d88f142bfbaafe5aa915b846b"

[vars]
AI_SEARCH_INSTANCE_NAME = "nameless-feather-c645"

[observability]
enabled = true
head_sampling_rate = 1

[env.production]
name = "feelgood-copy-production"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT"
id = "82a371c9f70447e2b28972e3f10777f7"

[env.production.vars]
AI_SEARCH_INSTANCE_NAME = "nameless-feather-c645"

[env.production.observability]
enabled = true
head_sampling_rate = 1




